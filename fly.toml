app = "emotion-agents"
primary_region = "nrt"

[build]

[env]
  PORT = "8000"

[mounts]
  source = "emotion_agents_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
